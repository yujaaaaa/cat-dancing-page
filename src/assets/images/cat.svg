<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Cat Body -->
  <ellipse cx="100" cy="120" rx="45" ry="50" fill="#FF8C42" stroke="#000" stroke-width="2"/>

  <!-- Cat Head -->
  <circle cx="100" cy="70" r="35" fill="#FF8C42" stroke="#000" stroke-width="2"/>

  <!-- Left Ear -->
  <polygon points="75,45 65,20 85,40" fill="#FF8C42" stroke="#000" stroke-width="2"/>
  <polygon points="75,45 70,30 80,40" fill="#FFB380"/>

  <!-- Right Ear -->
  <polygon points="125,45 135,20 115,40" fill="#FF8C42" stroke="#000" stroke-width="2"/>
  <polygon points="125,45 130,30 120,40" fill="#FFB380"/>

  <!-- Left Eye -->
  <ellipse cx="88" cy="65" rx="8" ry="12" fill="#000"/>
  <circle cx="88" cy="62" r="3" fill="#FFF"/>

  <!-- Right Eye -->
  <ellipse cx="112" cy="65" rx="8" ry="12" fill="#000"/>
  <circle cx="112" cy="62" r="3" fill="#FFF"/>

  <!-- Nose -->
  <polygon points="100,75 95,82 105,82" fill="#FFB380"/>

  <!-- Mouth -->
  <path d="M 100 82 Q 95 88 90 85" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  <path d="M 100 82 Q 105 88 110 85" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/>

  <!-- Whiskers Left -->
  <line x1="60" y1="68" x2="80" y2="70" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="75" x2="80" y2="75" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="82" x2="80" y2="80" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Whiskers Right -->
  <line x1="140" y1="68" x2="120" y2="70" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="140" y1="75" x2="120" y2="75" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="140" y1="82" x2="120" y2="80" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Left Paw -->
  <ellipse cx="75" cy="165" rx="12" ry="18" fill="#FF8C42" stroke="#000" stroke-width="2"/>

  <!-- Right Paw -->
  <ellipse cx="125" cy="165" rx="12" ry="18" fill="#FF8C42" stroke="#000" stroke-width="2"/>

  <!-- Tail -->
  <path d="M 145 130 Q 170 125 180 140 Q 185 150 175 155" fill="#FF8C42" stroke="#000" stroke-width="2"/>

  <!-- Belly Spot -->
  <ellipse cx="100" cy="130" rx="20" ry="25" fill="#FFB380" opacity="0.6"/>
</svg>
